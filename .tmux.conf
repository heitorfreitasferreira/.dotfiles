set-option -sa terminal-overrides ",xterm*:Tc"
set -g set-clipboard on
set -g allow-passthrough on
set -as terminal-features ",xterm-256color:clipboard"
set -as terminal-features ",tmux-256color:clipboard"

# Cores (grená e dourado)
set-option -g status-bg "#A50044"
set-option -g status-fg "#EDBB00"

# Aba ativa - destaque com cores invertidas
set -g window-status-current-style "bg=#EDBB00,fg=#A50044,bold"
set -g window-status-style "bg=#A50044,fg=#EDBB00"

# Espaçamento horizontal entre windows
set -g window-status-separator "  "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "

unbind r
bind r source-file ~/.tmux.conf \; display "Recarregado"

set -g prefix C-a

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Centralizar abas
set -g status-justify centre

# Direita limpa (sem hostname/splits) — só relógio
set -g status-right " %H:%M %d/%m/%y "
set -g status-left " #S "

set-option -g status-position top


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window


bind '-' split-window -v -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
